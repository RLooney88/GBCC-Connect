name: gbcc_connect_app
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # # Internationalization and Date Formatting
  intl: ^0.20.2

  # # State Management
  provider: ^6.1.5

  # # Local Storage
  shared_preferences: ^2.2.2

  # # HTTP Client
  http: ^1.4.0

  # # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # OCR for Business Card Scanning
  google_mlkit_text_recognition: ^0.15.0

  # # Image Processing for OCR
  image: ^4.5.4

  # # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.0

  # # HTTP Client (you already have dio, keeping both for flexibility)
  dio: ^5.5.0

  # # Firebase Functions
  cloud_functions: ^4.5.8
  # # Environment Configuration
  flutter_dotenv: ^5.2.1
  # # Secure Storage
  flutter_secure_storage: ^9.2.4
  # # Network Connectivity
  connectivity_plus: ^6.1.4
  # # Device Info
  device_info_plus: ^10.1.2
  # # URL Launcher
  url_launcher: ^6.3.1
  # # Icons
  font_awesome_flutter: ^10.8.0
  # # Firebase
  firebase_performance: ^0.9.3+8
  firebase_crashlytics: ^3.4.19
  firebase_analytics: ^10.9.0
  firebase_storage: ^11.6.10
  cloud_firestore: ^4.15.5
  sign_in_with_apple: ^7.0.1
  google_sign_in: ^6.2.2
  firebase_auth: ^4.17.5
  firebase_core: ^2.24.2
  firebase_remote_config: ^4.3.8
  firebase_messaging: ^14.7.20

  # # Timezone handling
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    # Environment files
    - .env
