plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"

    // Add the Google services Gradle plugin
    id 'com.google.gms.google-services'
}

dependencies {
  // Import the Firebase BoM - Using version compatible with minSDK 23
  implementation platform('com.google.firebase:firebase-bom:33.1.0')

  // TODO: Add the dependencies for Firebase products you want to use
  // When using the BoM, don't specify versions in Firebase dependencies
  implementation 'com.google.firebase:firebase-analytics'
  implementation 'com.google.firebase:firebase-firestore'

  // ML Kit Text Recognition - Updated to compatible versions
  implementation 'com.google.mlkit:text-recognition:16.0.0'
  implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
  implementation 'com.google.mlkit:text-recognition-devanagari:16.0.0'
  implementation 'com.google.mlkit:text-recognition-japanese:16.0.0'
  implementation 'com.google.mlkit:text-recognition-korean:16.0.0'

  // Add the dependencies for any other desired Firebase products
  // https://firebase.google.com/docs/android/setup#available-libraries
}

android {
    namespace = "com.chamber.gbcc_connect_app"
    compileSdk = 35   // flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
        
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:deprecation"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.chamber.gbcc_connect_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        
        // Add support for x86_64 architecture for emulator compatibility
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
    
    lintOptions {
        // Allow unsafe opt-in usage for ML Kit compatibility
        disable 'UnsafeOptInUsageError'
        
        // Treat warnings as errors for better code quality
        warningsAsErrors false
        
        // Specific suppressions for ML Kit deprecation warnings
        disable 'Deprecation'
        disable 'Unchecked'
        
        // Additional security-focused lint checks
        check 'NewApi'
        check 'ObsoleteLintCustomCheck'
        check 'UnusedResources'
    }
    
    // Add packaging options to handle conflicts
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
    }
}

flutter {
    source = "../.."
}

// Apply Google Services plugin for Firebase
apply plugin: 'com.google.gms.google-services'
